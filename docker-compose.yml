services:
  database:
    image: postgres
    restart: always
    ports:
      - 5432:5432 
    env_file:
      - ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - db_net
 
  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080
    networks: 
      - db_net
 
volumes:
  pgdata:

networks:
  db_net:
    driver: bridge  
    name: db_net
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"